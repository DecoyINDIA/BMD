<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title description">
  <title id="title">Segmented downloads in BMD</title>
  <desc id="description">Four parallel connections download different segments of a file. Each writes to its own position in the same file.</desc>
  <defs>
    <linearGradient id="board" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#142751"/>
      <stop offset=".56" stop-color="#0c1932"/>
      <stop offset="1" stop-color="#081226"/>
    </linearGradient>
    <linearGradient id="bezel" x2="0" y2="1">
      <stop stop-color="#d8e6ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#738fc1" stop-opacity=".10"/>
    </linearGradient>
    <linearGradient id="signal">
      <stop stop-color="#2279ff" stop-opacity="0"/>
      <stop offset=".64" stop-color="#6ba6ff"/>
      <stop offset="1" stop-color="#e1efff"/>
    </linearGradient>
    <linearGradient id="segment">
      <stop stop-color="#2455a3"/>
      <stop offset="1" stop-color="#548df0"/>
    </linearGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".8" fill="#a1bded" opacity=".19"/>
    </pattern>
    <clipPath id="panel"><rect x="464" y="40" width="454" height="240" rx="22"/></clipPath>
    <clipPath id="routes"><rect x="504" y="100" width="274" height="119"/></clipPath>
    <path id="route" d="M510 112H778" fill="none"/>
    <circle id="port" cx="510" cy="112" r="4.5"/>
    <rect id="packet" x="510" y="110" width="55" height="4" rx="2"/>
    <rect id="block" x="792" y="105" width="86" height="14" rx="3"/>
  </defs>
  <style>
    text { font-family: "Aptos", "Segoe UI", system-ui, sans-serif; }
    .packet { opacity: 0; }
    .block { transform-box: fill-box; transform-origin: left center; }
    @media (prefers-reduced-motion: no-preference) {
      .packet { animation: send 2.55s cubic-bezier(.38,.05,.27,1) var(--start) both; }
      .block { animation: fill .86s cubic-bezier(.22,.61,.23,1) var(--arrival) both; }
      .done { animation: complete .45s cubic-bezier(.18,.75,.29,1) 3.56s both; }
    }
    @keyframes send {
      0% { transform: translateX(0); opacity: 0; }
      13% { opacity: 1; }
      82% { opacity: 1; }
      100% { transform: translateX(222px); opacity: 0; }
    }
    @keyframes fill {
      from { transform: scaleX(0); opacity: 0; }
      25% { opacity: 1; }
      to { transform: scaleX(1); opacity: 1; }
    }
    @keyframes complete {
      from { transform: translateY(5px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>

  <rect x=".5" y=".5" width="959" height="319" rx="28" fill="url(#board)" stroke="url(#bezel)"/>
  <path d="M0 256H393M0 271H322M0 286H246" fill="none" stroke="#6499ff" stroke-opacity=".12"/>
  <path d="M44 64H88" fill="none" stroke="#73a7ff" stroke-width="3" stroke-linecap="round"/>
  <text x="42" y="132" fill="#f5f8ff" font-size="57" font-weight="750" letter-spacing="-2.9">Segmented</text>
  <text x="42" y="191" fill="#f5f8ff" font-size="57" font-weight="750" letter-spacing="-2.9">downloads</text>
  <text x="46" y="228" fill="#bcccf0" font-size="20">Transfer several parts of a file at once.</text>

  <rect x="456" y="32" width="470" height="256" rx="29" fill="#8bb3ff" fill-opacity=".07" stroke="url(#bezel)"/>
  <rect x="464.5" y="40.5" width="453" height="239" rx="22" fill="#0b152b" stroke="#23375b"/>
  <rect x="480" y="88" width="425" height="134" fill="url(#dots)" clip-path="url(#panel)"/>
  <path d="M488 85H895M488 230H895" fill="none" stroke="#89aef4" stroke-opacity=".17"/>
  <text x="490" y="70" fill="#bfd3f9" font-size="14" font-weight="650" letter-spacing="1">PARALLEL CONNECTIONS</text>

  <g stroke="#739bdf" stroke-opacity=".45" stroke-width="1.5">
    <use href="#route"/>
    <use href="#route" y="30"/>
    <use href="#route" y="60"/>
    <use href="#route" y="90"/>
  </g>
  <g fill="#102548" stroke="#86b4ff" stroke-width="1.5">
    <use href="#port"/>
    <use href="#port" y="30"/>
    <use href="#port" y="60"/>
    <use href="#port" y="90"/>
  </g>
  <g fill="url(#signal)" clip-path="url(#routes)">
    <use href="#packet" class="packet" style="--start:.20s"/>
    <use href="#packet" class="packet" y="30" style="--start:.49s"/>
    <use href="#packet" class="packet" y="60" style="--start:.33s"/>
    <use href="#packet" class="packet" y="90" style="--start:.61s"/>
  </g>

  <rect x="778.5" y="93.5" width="113" height="127" rx="11" fill="#122342" stroke="#4b6ea8"/>
  <g fill="#203657">
    <use href="#block"/>
    <use href="#block" y="30"/>
    <use href="#block" y="60"/>
    <use href="#block" y="90"/>
  </g>
  <g fill="url(#segment)">
    <use href="#block" class="block" style="--arrival:2.44s"/>
    <use href="#block" class="block" y="30" style="--arrival:2.73s"/>
    <use href="#block" class="block" y="60" style="--arrival:2.57s"/>
    <use href="#block" class="block" y="90" style="--arrival:2.85s"/>
  </g>
  <text x="490" y="257" fill="#bfd3f9" font-size="15">Each segment starts at a fixed file offset.</text>
  <g class="done">
    <circle cx="779" cy="252" r="8" fill="#1a3c37"/>
    <path d="m775 252 2.5 2.5 5-5" fill="none" stroke="#8ee697" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="795" y="257" fill="#9ceca4" font-size="15" font-weight="650">File complete</text>
  </g>
</svg>
