<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" role="img" aria-labelledby="title desc">
  <title id="title">A download you can pick up again</title>
  <desc id="desc">Four connections fetch parts of a single file. When you pause, all four keep their progress. Resume and the same parts fill to completion.</desc>
  <defs>
    <linearGradient id="sea" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#092539"/>
      <stop offset="1" stop-color="#101a2b"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "IBM Plex Sans", "Segoe UI", sans-serif; fill: #f3faf8; }
    .caption { fill: #b8ced1; font-size: 19px; }
    .part { transform-box: fill-box; transform-origin: left center; }
    .step { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .part { animation: transfer 8s linear 2; }
      .start { animation: start 8s step-end 2; }
      .pause { animation: pause 8s step-end 2; }
      .resume { animation: resume 8s step-end 2; }
      .end { animation: end 8s step-end 2; }
    }
    @keyframes transfer {
      0% { transform: scaleX(.02); }
      28%, 50% { transform: scaleX(var(--saved)); }
      80%, 100% { transform: scaleX(1); }
    }
    @keyframes start { 0% { opacity: 1; } 28%, 100% { opacity: 0; } }
    @keyframes pause { 0%, 50%, 100% { opacity: 0; } 28% { opacity: 1; } }
    @keyframes resume { 0%, 80%, 100% { opacity: 0; } 50% { opacity: 1; } }
    @keyframes end { 0% { opacity: 0; } 80%, 100% { opacity: 1; } }
  </style>
  <rect width="880" height="270" rx="22" fill="url(#sea)"/>
  <g transform="translate(42 0)">
    <text y="49" font-size="16" font-weight="650" letter-spacing="2" style="fill:#8be1d4">BLACK MARLIN DOWNLOADER</text>
    <text y="109" font-size="42" font-weight="700">Studio footage.zip</text>
    <g fill="#294555">
      <rect y="143" width="190" height="17" rx="4"/>
      <rect x="202" y="143" width="190" height="17" rx="4"/>
      <rect x="404" y="143" width="190" height="17" rx="4"/>
      <rect x="606" y="143" width="190" height="17" rx="4"/>
    </g>
    <g fill="#72e0ce">
      <rect class="part" y="143" width="190" height="17" rx="4" style="--saved:.42"/>
      <rect class="part" x="202" y="143" width="190" height="17" rx="4" style="--saved:.65"/>
      <rect class="part" x="404" y="143" width="190" height="17" rx="4" style="--saved:.32"/>
      <rect class="part" x="606" y="143" width="190" height="17" rx="4" style="--saved:.54"/>
    </g>
    <g font-size="25" font-weight="650">
      <text class="step start" y="205">Downloading</text>
      <text class="step pause" y="205">Paused</text>
      <text class="step resume" y="205">Resuming</text>
      <text class="end" y="205">Download complete</text>
    </g>
    <g class="caption">
      <text class="step start" y="237">Four connections are fetching different parts of your file.</text>
      <text class="step pause" y="237">Each part keeps its place.</text>
      <text class="step resume" y="237">All four parts pick up where they left off.</text>
      <text class="end" y="237">Your file is ready to open.</text>
    </g>
  </g>
</svg>
