<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import {
  PALETTES, injectBrandFonts, clamp01, lerp, remap, smoothstep,
  easeOutExpo, easeInOutCubic, drawRoundedRect
} from '/velocity/lib/core.mjs';

let ctx, W, H, P;

const CLUTTER = [
  { label: 'ADS',           yOff: -86, phase: 0.00 },
  { label: 'TRIAL EXPIRED', yOff: -28, phase: 0.25 },
  { label: 'TELEMETRY',     yOff:  32, phase: 0.50 },
  { label: 'CLOUD RELAY',   yOff:  88, phase: 0.75 },
];

const TRUTHS = [
  { k: 'GPL-3.0-OR-LATER',   sub: 'Clean-room Rust · Copyleft source forever' },
  { k: 'NO ADS OR TRIALS',   sub: 'Zero nag screens, zero upsell timers' },
  { k: 'ZERO TELEMETRY',     sub: 'No analytics SDKs, no phone-home beacons' },
  { k: '100% LOCAL CONTROL', sub: 'Offline DB-IP geo + LAN HTTPS :8463 only' },
];

window.initScene = async ({ theme, width, height }) => {
  W = width; H = height; P = PALETTES[theme] || PALETTES.dark;
  injectBrandFonts();
  await document.fonts.ready;
  const c = document.getElementById('c');
  c.width = W; c.height = H;
  ctx = c.getContext('2d');
};

window.renderFrame = async (t, progress) => {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = P.bg;
  ctx.fillRect(0, 0, W, H);

  const loopFade = smoothstep(0.0, 0.04, progress) * (1 - smoothstep(0.92, 0.995, progress));

  // Header
  ctx.save();
  ctx.globalAlpha = 0.35 + 0.65 * loopFade;
  ctx.fillStyle = P.primary;
  ctx.font = '600 11.5px "IBM Plex Mono", monospace';
  ctx.fillText('PRIVACY & FREEDOM  ·  LOCAL OPTICAL SOVEREIGNTY  ·  GPL-3.0-OR-LATER', 44, 36);
  ctx.fillStyle = P.text;
  ctx.font = '700 24px "Space Grotesk", sans-serif';
  ctx.fillText('Nothing Leaves Your Machine Without Your Command', 44, 66);
  ctx.restore();

  // Left: "The Open Glass Prism" Chamber (NO generic shield/padlock cliché!)
  const px = 310, py = 236, radX = 128, radY = 114;
  ctx.save();
  ctx.globalAlpha = loopFade;

  // Laminar optical paths passing cleanly through the local crystal chamber
  for (let i = -1; i <= 1; i++) {
    const ly = py + i * 32;
    ctx.strokeStyle = P.hairlineStrong;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(px - 94, ly);
    ctx.lineTo(px + 94, ly);
    ctx.stroke();

    const dotP = (progress * 2 + (i + 1) * 0.28) % 1;
    const dx = lerp(px - 90, px + 90, dotP);
    ctx.fillStyle = P.primary;
    ctx.beginPath(); ctx.arc(dx, ly, 3.2, 0, Math.PI * 2); ctx.fill();
  }

  // Faceted Optical Hexagonal Glass Prism Chamber
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 - Math.PI / 6;
    const vx = px + Math.cos(a) * radX;
    const vy = py + Math.sin(a) * radY;
    if (i === 0) ctx.moveTo(vx, vy);
    else ctx.lineTo(vx, vy);
  }
  ctx.closePath();
  ctx.fillStyle = P.isDark ? 'rgba(85, 201, 157, 0.08)' : 'rgba(19, 111, 80, 0.06)';
  ctx.fill();
  ctx.strokeStyle = P.primary;
  ctx.lineWidth = 2;
  ctx.stroke();

  // Dedicated chamber header & footer badges clear of optical paths
  ctx.fillStyle = P.primary;
  ctx.font = '700 12px "IBM Plex Mono", monospace';
  ctx.textAlign = 'center';
  ctx.fillText('LOCAL MACHINE', px, py - radY - 12);
  ctx.fillStyle = P.textMuted;
  ctx.font = '500 11px "IBM Plex Mono", monospace';
  ctx.fillText('bmd-engine · bmd-geo · SHA-256', px, py + radY + 20);
  ctx.textAlign = 'left';

  // External clutter tokens deflect smoothly OUTSIDE the crystal prism boundary & dissipate!
  CLUTTER.forEach((cl) => {
    const p = (progress * 2 + cl.phase) % 1;
    const prismLeftEdge = px - radX - 18;
    const x = lerp(36, prismLeftEdge, clamp01(p * 1.15));
    const deflect = smoothstep(0.32, 0.92, p);
    const dir = cl.yOff >= 0 ? 1 : -1;
    const y = py + cl.yOff + dir * deflect * 58;
    const alpha = Math.sin(p * Math.PI) * (1 - deflect * 0.85);

    ctx.save();
    ctx.globalAlpha = loopFade * alpha;
    ctx.font = '600 10.5px "IBM Plex Mono", monospace';
    const tw = ctx.measureText(cl.label).width + 16;
    drawRoundedRect(ctx, x - tw, y - 12, tw, 22, 4);
    ctx.fillStyle = P.isDark ? 'rgba(248, 113, 113, 0.14)' : 'rgba(220, 38, 38, 0.10)';
    ctx.fill();
    ctx.strokeStyle = P.crimson;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = P.crimson;
    ctx.fillText(cl.label, x - tw + 8, y + 3);
    ctx.restore();
  });

  // Right: 4 Architectural Freedom Truths
  const rx = 500, rw = W - rx - 44;
  TRUTHS.forEach((tr, i) => {
    const ty = 102 + i * 68;
    const rev = easeOutExpo(remap(progress, 0.12 + i * 0.10, 0.28 + i * 0.10));
    ctx.save();
    ctx.globalAlpha = loopFade * (0.35 + 0.65 * rev);
    drawRoundedRect(ctx, rx, ty, rw, 56, 8);
    ctx.fillStyle = P.surface;
    ctx.fill();
    ctx.strokeStyle = rev > 0.8 ? P.hairlineStrong : P.hairline;
    ctx.stroke();

    drawRoundedRect(ctx, rx, ty, 6, 56, 3);
    ctx.fillStyle = P.primary;
    ctx.fill();

    ctx.fillStyle = P.text;
    ctx.font = '700 15px "Space Grotesk", sans-serif';
    ctx.fillText(tr.k, rx + 20, ty + 24);
    ctx.fillStyle = P.textMuted;
    ctx.font = '400 12.5px "IBM Plex Sans", sans-serif';
    ctx.fillText(tr.sub, rx + 20, ty + 44);
    ctx.restore();
  });

  ctx.restore();
};
</script>
</body>
</html>
