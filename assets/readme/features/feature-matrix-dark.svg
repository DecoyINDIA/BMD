<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" width="1120" height="480" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">BMD Feature Matrix (dark)</title>
  <desc id="svg-desc">Six-card ruled manifest of BMD&#x27;s core capabilities: segmented HTTP/FTP, BitTorrent, video relay, remote HTTPS, MCP/CLI, and 86 languages.</desc>
  <defs>
    <linearGradient id="feat-dark-bg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#0c1a33"/>
      <stop offset="100%" stop-color="#081226"/>
    </linearGradient><clipPath id="feat-dark-clip"><rect x="24" y="24" width="1072" height="432" rx="12"/></clipPath>
  </defs>
  <style>
    .t-disp { font-family: 'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .t-body { font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .t-mono { font-family: 'IBM Plex Mono', 'Cascadia Mono', Consolas, ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .tnum { font-variant-numeric: tabular-nums; }

  </style>
  <rect width="1120" height="480" rx="16" fill="url(#feat-dark-bg)"/>
  <path d="M40 0v480M80 0v480M120 0v480M160 0v480M200 0v480M240 0v480M280 0v480M320 0v480M360 0v480M400 0v480M440 0v480M480 0v480M520 0v480M560 0v480M600 0v480M640 0v480M680 0v480M720 0v480M760 0v480M800 0v480M840 0v480M880 0v480M920 0v480M960 0v480M1000 0v480M1040 0v480M1080 0v480M0 40h1120M0 80h1120M0 120h1120M0 160h1120M0 200h1120M0 240h1120M0 280h1120M0 320h1120M0 360h1120M0 400h1120M0 440h1120" stroke="#1c2e52" stroke-width="1" stroke-opacity="0.22"/>
  <path d="M16 24h12M22 18v12M1092 24h12M1098 18v12M16 456h12M22 450v12M1092 456h12M1098 450v12" stroke="#c3cde0" stroke-width="1.2" stroke-opacity="0.35" stroke-linecap="round"/>
  <rect x="1" y="1" width="1118" height="478" rx="15" fill="none" stroke="#1c2e52" stroke-width="1.5"/>
    <g>
    <rect x="24" y="32" width="1072" height="432" rx="12" fill="#000000" fill-opacity="0.24"/>
    <rect x="24" y="25" width="1072" height="432" rx="12" fill="#000000" fill-opacity="0.16"/>
    <rect x="24" y="24" width="1072" height="432" rx="12" fill="#11151d"/>
  </g>
  <g clip-path="url(#feat-dark-clip)">
    <rect x="24" y="24" width="1072" height="46" fill="#eef1f6"/>
    <text x="48" y="53" fill="#11151d" font-size="15.5" font-weight="800" letter-spacing="0.7" class="t-disp">CONTENTS  ·  PACKING LIST &amp; CAPABILITIES</text>
    <text x="1072" y="52" text-anchor="end" fill="#192030" font-size="12" class="t-mono">6 core subsystems · Free &amp; Open Source (GPL-3.0)</text>
  </g>
  <rect x="48" y="94" width="336" height="158" rx="8" fill="#192030" stroke="#2a3242" stroke-width="1.2"/><text x="64" y="120" fill="#98a1b1" font-size="10.5" font-weight="700" letter-spacing="0.9" class="t-disp">01 · ENGINE</text><text x="64" y="146" fill="#eef1f6" font-size="18.5" font-weight="800" class="t-disp">Segmented HTTP/FTP</text><text x="64" y="174" fill="#c3cad6" font-size="12.5" class="t-body">Up to 128 parallel workers with dynamic</text><text x="64" y="192" fill="#c3cad6" font-size="12.5" class="t-body">largest-part re-splitting, sparse writes,</text><text x="64" y="210" fill="#c3cad6" font-size="12.5" class="t-body">and BoringSSL browser-like TLS fallback.</text><line x1="64" y1="224" x2="368" y2="224" stroke="#2a3242" stroke-width="1"/><text x="64" y="241" fill="#86b6ff" font-size="11" font-weight="600" class="t-mono">crates/engine · FTP/FTPS · PAC</text><rect x="392" y="94" width="336" height="158" rx="8" fill="#192030" stroke="#2a3242" stroke-width="1.2"/><text x="408" y="120" fill="#98a1b1" font-size="10.5" font-weight="700" letter-spacing="0.9" class="t-disp">02 · SWARM</text><text x="408" y="146" fill="#eef1f6" font-size="18.5" font-weight="800" class="t-disp">BitTorrent &amp; Magnets</text><text x="408" y="174" fill="#c3cad6" font-size="12.5" class="t-body">Built-in librqbit + uTP torrent engine.</text><text x="408" y="192" fill="#c3cad6" font-size="12.5" class="t-body">Selective file picking, piece-map grid, DHT,</text><text x="408" y="210" fill="#c3cad6" font-size="12.5" class="t-body">peer filtering, and IP blocklists.</text><line x1="408" y1="224" x2="712" y2="224" stroke="#2a3242" stroke-width="1"/><text x="408" y="241" fill="#86b6ff" font-size="11" font-weight="600" class="t-mono">crates/torrent · magnet: · .torrent</text><rect x="736" y="94" width="336" height="158" rx="8" fill="#192030" stroke="#2a3242" stroke-width="1.2"/><text x="752" y="120" fill="#98a1b1" font-size="10.5" font-weight="700" letter-spacing="0.9" class="t-disp">03 · MEDIA</text><text x="752" y="146" fill="#eef1f6" font-size="18.5" font-weight="800" class="t-disp">Video &amp; Gallery Relay</text><text x="752" y="174" fill="#c3cad6" font-size="12.5" class="t-body">Up to 4K 60fps HDR &amp; H.264+AAC preset via</text><text x="752" y="192" fill="#c3cad6" font-size="12.5" class="t-body">yt-dlp + ffmpeg + gallery-dl, chapter</text><text x="752" y="210" fill="#c3cad6" font-size="12.5" class="t-body">embedding, and parallel HLS/DASH.</text><line x1="752" y1="224" x2="1056" y2="224" stroke="#2a3242" stroke-width="1"/><text x="752" y="241" fill="#86b6ff" font-size="11" font-weight="600" class="t-mono">crates/tools · 1,000+ sites</text><rect x="48" y="266" width="336" height="158" rx="8" fill="#192030" stroke="#2a3242" stroke-width="1.2"/><text x="64" y="292" fill="#98a1b1" font-size="10.5" font-weight="700" letter-spacing="0.9" class="t-disp">04 · SERVER</text><text x="64" y="318" fill="#eef1f6" font-size="18.5" font-weight="800" class="t-disp">Headless &amp; HTTPS Remote</text><text x="64" y="346" fill="#c3cad6" font-size="12.5" class="t-body">Run --headless on Linux or Docker/Unraid.</text><text x="64" y="364" fill="#c3cad6" font-size="12.5" class="t-body">Control queues from your phone over paired</text><text x="64" y="382" fill="#c3cad6" font-size="12.5" class="t-body">local HTTPS with device tokens.</text><line x1="64" y1="396" x2="368" y2="396" stroke="#2a3242" stroke-width="1"/><text x="64" y="413" fill="#86b6ff" font-size="11" font-weight="600" class="t-mono">crates/remote · Docker · QR pairing</text><rect x="392" y="266" width="336" height="158" rx="8" fill="#192030" stroke="#2a3242" stroke-width="1.2"/><text x="408" y="292" fill="#98a1b1" font-size="10.5" font-weight="700" letter-spacing="0.9" class="t-disp">05 · AUTOMATION</text><text x="408" y="318" fill="#eef1f6" font-size="18.5" font-weight="800" class="t-disp">MCP Server &amp; CLI</text><text x="408" y="346" fill="#c3cad6" font-size="12.5" class="t-body">Official rmcp stdio server (bmd-mcp) and</text><text x="408" y="364" fill="#c3cad6" font-size="12.5" class="t-body">scriptable bmd-cli automation API so AI</text><text x="408" y="382" fill="#c3cad6" font-size="12.5" class="t-body">assistants &amp; scripts can manage queues.</text><line x1="408" y1="396" x2="712" y2="396" stroke="#2a3242" stroke-width="1"/><text x="408" y="413" fill="#86b6ff" font-size="11" font-weight="600" class="t-mono">crates/mcp · crates/cli · JSON schema</text><rect x="736" y="266" width="336" height="158" rx="8" fill="#192030" stroke="#2a3242" stroke-width="1.2"/><text x="752" y="292" fill="#98a1b1" font-size="10.5" font-weight="700" letter-spacing="0.9" class="t-disp">06 · LOCALIZATION</text><text x="752" y="318" fill="#eef1f6" font-size="18.5" font-weight="800" class="t-disp">86 Languages &amp; Themes</text><text x="752" y="346" fill="#c3cad6" font-size="12.5" class="t-body">Full RTL support (Arabic, Persian, Hebrew,</text><text x="752" y="364" fill="#c3cad6" font-size="12.5" class="t-body">Urdu), 10 built-in themes (Luna, Aero,</text><text x="752" y="382" fill="#c3cad6" font-size="12.5" class="t-body">Adwaita, Breeze, Emerald...) + theme.toml.</text><line x1="752" y1="396" x2="1056" y2="396" stroke="#2a3242" stroke-width="1"/><text x="752" y="413" fill="#86b6ff" font-size="11" font-weight="600" class="t-mono">i18n/ · OKLab WCAG AA palettes</text>
</svg>
