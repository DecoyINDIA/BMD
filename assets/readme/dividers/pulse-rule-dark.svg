<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="1200" height="28" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Telemetry rule divider (dark)</title>
  <desc id="svg-desc">Clean telemetry baseline divider with converging pulses.</desc>
  <defs>
  </defs>
  <style>
    .t-disp { font-family: 'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .t-body { font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .t-mono { font-family: 'IBM Plex Mono', 'Cascadia Mono', Consolas, ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .tnum { font-variant-numeric: tabular-nums; }

    .pulse-r { animation: pulse-right 5s ease-in-out infinite; }
    .pulse-l { animation: pulse-left 5s ease-in-out infinite; }
    @keyframes pulse-right {
      0% { transform: translateX(0px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(520px); opacity: 0; }
    }
    @keyframes pulse-left {
      0% { transform: translateX(0px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(-520px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse-r, .pulse-l { animation: none; opacity: 0; }
    }
  </style>
  <line x1="24" y1="14" x2="1176" y2="14" stroke="#2a3242" stroke-width="1.5"/>
  <line x1="60" y1="10" x2="60" y2="18" stroke="#2a3242" stroke-width="1"/><line x1="120" y1="10" x2="120" y2="18" stroke="#2a3242" stroke-width="1"/><line x1="180" y1="10" x2="180" y2="18" stroke="#2a3242" stroke-width="1"/><line x1="240" y1="10" x2="240" y2="18" stroke="#2a3242" stroke-width="1"/><line x1="300" y1="10" x2="300" y2="18" stroke="#2a3242" stroke-width="1"/><line x1="360" y1="10" x2="360" y2="18" stroke="#2a3242" stroke-width="1"/><line x1="420" y1="10" x2="420" y2="18" stroke="#2a3242" stroke-width="1"/><line x1="480" y1="10" x2="480" y2="18" stroke="#2a3242" stroke-width="1"/><line x1="540" y1="10" x2="540" y2="18" stroke="#2a3242" stroke-width="1"/><line x1="600" y1="10" x2="600" y2="18" stroke="#2a3242" stroke-width="1"/><line x1="660" y1="10" x2="660" y2="18" stroke="#2a3242" stroke-width="1"/><line x1="720" y1="10" x2="720" y2="18" stroke="#2a3242" stroke-width="1"/><line x1="780" y1="10" x2="780" y2="18" stroke="#2a3242" stroke-width="1"/><line x1="840" y1="10" x2="840" y2="18" stroke="#2a3242" stroke-width="1"/><line x1="900" y1="10" x2="900" y2="18" stroke="#2a3242" stroke-width="1"/><line x1="960" y1="10" x2="960" y2="18" stroke="#2a3242" stroke-width="1"/><line x1="1020" y1="10" x2="1020" y2="18" stroke="#2a3242" stroke-width="1"/><line x1="1080" y1="10" x2="1080" y2="18" stroke="#2a3242" stroke-width="1"/><line x1="1140" y1="10" x2="1140" y2="18" stroke="#2a3242" stroke-width="1"/>
  <polygon points="600,6 608,14 600,22 592,14" fill="#0c1a33" stroke="#1c2e52" stroke-width="1"/>
  <circle class="pulse-r" cx="60" cy="14" r="3.5" fill="#86b6ff"/>
  <circle class="pulse-l" cx="1140" cy="14" r="3.5" fill="#86b6ff"/>
</svg>
