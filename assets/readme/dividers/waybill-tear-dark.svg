<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 32" width="1200" height="32" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Thermal waybill tear divider (dark)</title>
  <desc id="svg-desc">Dashed thermal perforation divider with moving scanner tick.</desc>
  <defs>
  </defs>
  <style>
    .t-disp { font-family: 'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .t-body { font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .t-mono { font-family: 'IBM Plex Mono', 'Cascadia Mono', Consolas, ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .tnum { font-variant-numeric: tabular-nums; }

    .tear-scan { animation: tear-slide 6s ease-in-out infinite; }
    @keyframes tear-slide {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(980px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .tear-scan { animation: none; }
    }
  </style>
  <rect x="0" y="6" width="1200" height="20" rx="4" fill="#192030" stroke="#2a3242" stroke-width="1"/>
  <circle cx="0" cy="16" r="7" fill="#0c1a33"/>
  <circle cx="1200" cy="16" r="7" fill="#0c1a33"/>
  <line x1="20" y1="16" x2="1180" y2="16" stroke="#98a1b1" stroke-width="1.5" stroke-dasharray="7 6" stroke-opacity="0.65"/>
  <rect x="530" y="7" width="140" height="18" rx="4" fill="#11151d" stroke="#2a3242" stroke-width="1"/>
  <text x="600" y="19.5" text-anchor="middle" fill="#98a1b1" font-size="9.5" font-weight="700" letter-spacing="1.8" class="t-mono">CUT / WAYBILL</text>
  <g class="tear-scan">
    <rect x="92" y="10" width="28" height="12" rx="3" fill="#0c1a33" fill-opacity="0.88"/>
    <circle cx="106" cy="16" r="2.2" fill="#f2f5fb"/>
  </g>
</svg>
