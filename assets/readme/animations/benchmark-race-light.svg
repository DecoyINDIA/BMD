    <text x="48" y="53" fill="#fcfcfb" font-size="15.5" font-weight="800" letter-spacing="0.7" class="t-disp">TRACKING RACE  ·  LOCAL LOOPBACK BENCHMARK</text>
    <text x="1072" y="52" text-anchor="end" fill="#f0f3f7" font-size="12" class="t-mono">BMD v1.0.0 vs IDM 6.42.25.3  ·  7-run medians</text>
  </g>

  <text x="48" y="96" fill="#111318" font-size="16" font-weight="800" class="t-disp">1 GiB over a fast local link (fast-1g)</text>
  <text x="1072" y="96" text-anchor="end" fill="#5f6676" font-size="11.5" class="t-mono">Dashed = startup delay  ·  Solid = transfer + finish</text>

