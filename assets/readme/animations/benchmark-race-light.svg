  <text x="48" y="212" fill="#5f6676" font-size="11.5" class="t-mono">5,456 ms (3,076 ms start)</text>
  <rect x="220.0" y="184" width="780.0" height="28" rx="5" fill="#e4e9f2"/>
  <line class="idm-start" x1="220.0" y1="198" x2="619.8" y2="198" stroke="#8f97a6" stroke-width="6" stroke-dasharray="8 6"/>
