<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" width="1120" height="500" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">BMD vs IDM Tracking Race Benchmark (light)</title>
  <desc id="svg-desc">Animated tracking race from website/bench/results.json showing BMD 1,009 ms vs IDM 6.42 5,456 ms (5.41x faster) plus six other scenarios.</desc>
  <defs>
    <linearGradient id="race-light-bg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#1f63d6"/>
      <stop offset="100%" stop-color="#1854bb"/>
    </linearGradient><clipPath id="race-light-clip"><rect x="24" y="24" width="1072" height="452" rx="12"/></clipPath>
  </defs>
  <style>
    .t-disp { font-family: 'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .t-body { font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .t-mono { font-family: 'IBM Plex Mono', 'Cascadia Mono', Consolas, ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .tnum { font-variant-numeric: tabular-nums; }

    .bmd-start { transform-box: fill-box; transform-origin: left center; animation: bstart 9s linear infinite; }
    .bmd-run { transform-box: fill-box; transform-origin: left center; animation: brun 9s linear infinite; }
    .bmd-done { opacity: 0; animation: bdone 9s ease-out infinite; }
    .bmd-stamp { transform-box: fill-box; transform-origin: center; animation: bstamp 9s cubic-bezier(.2,.9,.3,1) infinite; }
    .idm-start { transform-box: fill-box; transform-origin: left center; animation: istart 9s linear infinite; }
    .idm-run { transform-box: fill-box; transform-origin: left center; animation: irun 9s linear infinite; }
    @keyframes bstart {
      0%, 5% { transform: scaleX(0); }
      7%, 93% { transform: scaleX(1); }
      100% { transform: scaleX(0); }
    }
    @keyframes brun {
      0%, 7% { transform: scaleX(0); }
      20%, 93% { transform: scaleX(1); }
      100% { transform: scaleX(0); }
    }
    @keyframes bdone {
      0%, 19% { opacity: 0; }
      22%, 93% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes bstamp {
      0%, 20% { opacity: 0; transform: scale(1.25) rotate(-5deg); }
      25%, 93% { opacity: 1; transform: scale(1) rotate(-5deg); }
      99%, 100% { opacity: 0; transform: scale(1) rotate(-5deg); }
    }
    @keyframes istart {
      0%, 6% { transform: scaleX(0); }
      48%, 93% { transform: scaleX(1); }
      100% { transform: scaleX(0); }
    }
    @keyframes irun {
      0%, 48% { transform: scaleX(0); }
      81%, 93% { transform: scaleX(1); }
      100% { transform: scaleX(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bmd-start, .bmd-run, .bmd-done, .bmd-stamp, .idm-start, .idm-run {
        animation: none !important; opacity: 1 !important; transform: none !important;
      }
      .bmd-stamp { transform: rotate(-5deg) !important; }
    }
  </style>
  <rect width="1120" height="500" rx="16" fill="url(#race-light-bg)"/>
  <path d="M40 0v500M80 0v500M120 0v500M160 0v500M200 0v500M240 0v500M280 0v500M320 0v500M360 0v500M400 0v500M440 0v500M480 0v500M520 0v500M560 0v500M600 0v500M640 0v500M680 0v500M720 0v500M760 0v500M800 0v500M840 0v500M880 0v500M920 0v500M960 0v500M1000 0v500M1040 0v500M1080 0v500M0 40h1120M0 80h1120M0 120h1120M0 160h1120M0 200h1120M0 240h1120M0 280h1120M0 320h1120M0 360h1120M0 400h1120M0 440h1120M0 480h1120" stroke="#3b78e0" stroke-width="1" stroke-opacity="0.22"/>
  <path d="M16 24h12M22 18v12M1092 24h12M1098 18v12M16 476h12M22 470v12M1092 476h12M1098 470v12" stroke="#e6eefd" stroke-width="1.2" stroke-opacity="0.35" stroke-linecap="round"/>
