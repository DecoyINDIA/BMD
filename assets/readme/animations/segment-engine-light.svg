<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">BMD Adaptive Segment Engine (light)</title>
  <desc id="svg-desc">Diagram showing probe(), 8 parallel workers, slow-worker drop with largest-remaining-part re-splitting, sparse writes, and atomic rename.</desc>
  <defs>
    <linearGradient id="segeng-light-bg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#1f63d6"/>
      <stop offset="100%" stop-color="#1854bb"/>
    </linearGradient><clipPath id="segeng-light-clip"><rect x="24" y="24" width="1072" height="372" rx="12"/></clipPath>
  </defs>
  <style>
    .t-disp { font-family: 'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .t-body { font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .t-mono { font-family: 'IBM Plex Mono', 'Cascadia Mono', Consolas, ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .tnum { font-variant-numeric: tabular-nums; }

    .commit-stamp {
      transform-box: fill-box;
      transform-origin: center;
      animation: c-stamp 8.5s cubic-bezier(.2,.9,.3,1) infinite;
    }
    .pulse-arrow {
      animation: arrow-pulse 8.5s linear infinite;
    }
    @keyframes c-stamp {
      0%, 68% { opacity: 0; transform: scale(1.2) rotate(-5deg); }
      74%, 92% { opacity: 1; transform: scale(1) rotate(-5deg); }
      98%, 100% { opacity: 0; transform: scale(1) rotate(-5deg); }
    }
    @keyframes arrow-pulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    @keyframes wf0 { 0%, 6% { transform: scaleX(0.03); } 48%, 92% { transform: scaleX(1); } 100% { transform: scaleX(0.03); } }
.wf-0 { transform-box: fill-box; transform-origin: left center; animation: wf0 8.5s cubic-bezier(.22,.8,.35,1) infinite; }
@keyframes wf1 { 0%, 8% { transform: scaleX(0.03); } 47%, 92% { transform: scaleX(1); } 100% { transform: scaleX(0.03); } }
.wf-1 { transform-box: fill-box; transform-origin: left center; animation: wf1 8.5s cubic-bezier(.22,.8,.35,1) infinite; }
@keyframes wf2 { 0%, 9% { transform: scaleX(0.03); } 54%, 92% { transform: scaleX(1); } 100% { transform: scaleX(0.03); } }
.wf-2 { transform-box: fill-box; transform-origin: left center; animation: wf2 8.5s cubic-bezier(.22,.8,.35,1) infinite; }
@keyframes wf3 { 0%, 7% { transform: scaleX(0.03); } 48%, 92% { transform: scaleX(1); } 100% { transform: scaleX(0.03); } }
.wf-3 { transform-box: fill-box; transform-origin: left center; animation: wf3 8.5s cubic-bezier(.22,.8,.35,1) infinite; }
@keyframes wf4 { 0%, 10% { transform: scaleX(0.03); } 54%, 92% { transform: scaleX(1); } 100% { transform: scaleX(0.03); } }
.wf-4 { transform-box: fill-box; transform-origin: left center; animation: wf4 8.5s cubic-bezier(.22,.8,.35,1) infinite; }
@keyframes wslow { 0%, 10% { transform: scaleX(0.05); } 38%, 92% { transform: scaleX(1); } 100% { transform: scaleX(0.05); } }
@keyframes wsplit { 0%, 40% { transform: scaleX(0.01); opacity: 0.2; } 44% { opacity: 1; } 68%, 92% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(0.01); opacity: 0.2; } }
.w-slow { transform-box: fill-box; transform-origin: left center; animation: wslow 8.5s ease-out infinite; }
.w-split { transform-box: fill-box; transform-origin: left center; animation: wsplit 8.5s cubic-bezier(.2,.8,.3,1) infinite; }
@keyframes wf6 { 0%, 8% { transform: scaleX(0.03); } 51%, 92% { transform: scaleX(1); } 100% { transform: scaleX(0.03); } }
.wf-6 { transform-box: fill-box; transform-origin: left center; animation: wf6 8.5s cubic-bezier(.22,.8,.35,1) infinite; }
@keyframes wf7 { 0%, 12% { transform: scaleX(0.03); } 59%, 92% { transform: scaleX(1); } 100% { transform: scaleX(0.03); } }
.wf-7 { transform-box: fill-box; transform-origin: left center; animation: wf7 8.5s cubic-bezier(.22,.8,.35,1) infinite; }
    @media (prefers-reduced-motion: reduce) {
      .w-fast, .w-slow, .w-split, .commit-stamp, .pulse-arrow { animation: none !important; opacity: 1 !important; transform: none !important; }
      .commit-stamp { transform: rotate(-5deg) !important; }
    }
  </style>
  <rect width="1120" height="420" rx="16" fill="url(#segeng-light-bg)"/>
  <path d="M40 0v420M80 0v420M120 0v420M160 0v420M200 0v420M240 0v420M280 0v420M320 0v420M360 0v420M400 0v420M440 0v420M480 0v420M520 0v420M560 0v420M600 0v420M640 0v420M680 0v420M720 0v420M760 0v420M800 0v420M840 0v420M880 0v420M920 0v420M960 0v420M1000 0v420M1040 0v420M1080 0v420M0 40h1120M0 80h1120M0 120h1120M0 160h1120M0 200h1120M0 240h1120M0 280h1120M0 320h1120M0 360h1120M0 400h1120" stroke="#3b78e0" stroke-width="1" stroke-opacity="0.22"/>
  <path d="M16 24h12M22 18v12M1092 24h12M1098 18v12M16 396h12M22 390v12M1092 396h12M1098 390v12" stroke="#e6eefd" stroke-width="1.2" stroke-opacity="0.35" stroke-linecap="round"/>
  <rect x="1" y="1" width="1118" height="418" rx="15" fill="none" stroke="#3b78e0" stroke-width="1.5"/>
    <g>
    <rect x="24" y="32" width="1072" height="372" rx="12" fill="#06163c" fill-opacity="0.24"/>
    <rect x="24" y="25" width="1072" height="372" rx="12" fill="#06163c" fill-opacity="0.16"/>
    <rect x="24" y="24" width="1072" height="372" rx="12" fill="#fcfcfb"/>
  </g>
  <g clip-path="url(#segeng-light-clip)">
    <rect x="24" y="24" width="1072" height="46" fill="#111318"/>
    <text x="48" y="53" fill="#fcfcfb" font-size="15.5" font-weight="800" letter-spacing="0.7" class="t-disp">BMD ENGINE  ·  ADAPTIVE SEGMENT PLANNER</text>
    <text x="1072" y="52" text-anchor="end" fill="#f0f3f7" font-size="12" class="t-mono">crates/engine/src/planner.rs</text>
  </g>

  <!-- Stage 1: Probe -->
  <rect x="48" y="94" width="222" height="278" rx="8" fill="#f0f3f7" stroke="#dde1e8" stroke-width="1.2"/>
  <text x="64" y="120" fill="#5f6676" font-size="11" font-weight="700" letter-spacing="0.9" class="t-disp">STAGE 01  ·  PROBE()</text>
  <line x1="64" y1="130" x2="254" y2="130" stroke="#111318" stroke-width="1.5"/>
  <text x="64" y="156" fill="#111318" font-size="13.5" font-weight="700" class="t-mono">GET Range: bytes=0-</text>
  <text x="64" y="182" fill="#434956" font-size="12" class="t-body">• Content-Length: 1.00 GiB</text>
  <text x="64" y="204" fill="#434956" font-size="12" class="t-body">• Accept-Ranges: bytes</text>
  <text x="64" y="226" fill="#434956" font-size="12" class="t-body">• ETag / Last-Modified</text>
  <text x="64" y="248" fill="#434956" font-size="12" class="t-body">• HostLimits check</text>
  <rect x="64" y="274" width="190" height="78" rx="6" fill="#fcfcfb" stroke="#dde1e8" stroke-width="1"/>
  <text x="76" y="297" fill="#5f6676" font-size="10.5" font-weight="700" class="t-disp">FALLBACKS</text>
  <text x="76" y="317" fill="#111318" font-size="11.5" class="t-mono">FTP REST+RETR pool</text>
  <text x="76" y="337" fill="#111318" font-size="11.5" class="t-mono">BoringSSL browser TLS</text>

  <!-- Connector 1->2 -->
  <path class="pulse-arrow" d="M276 232h22m-7-6l7 6-7 6" fill="none" stroke="#0d58c9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stage 2: Parallel Workers + Re-split -->
  <rect x="304" y="94" width="500" height="278" rx="8" fill="#fcfcfb" stroke="#111318" stroke-width="1.5"/>
  <text x="322" y="120" fill="#5f6676" font-size="11" font-weight="700" letter-spacing="0.9" class="t-disp">STAGE 02  ·  8 WORKERS + LARGEST-PART RE-SPLIT</text>
  <line x1="322" y1="130" x2="786" y2="130" stroke="#111318" stroke-width="1.5"/>
  <text x="322" y="161" fill="#111318" font-size="11.5" font-weight="700" class="t-mono">S0 · W1</text><rect x="430" y="150" width="260" height="14" rx="3" fill="#e4e9f2" stroke="#dde1e8" stroke-width="1"/><rect class="w-fast wf-0" x="430" y="150" width="260" height="14" rx="3" fill="#57cc5a"/><text x="702" y="161" fill="#5f6676" font-size="10.5" class="t-mono">0–128M</text><text x="322" y="188" fill="#111318" font-size="11.5" font-weight="700" class="t-mono">S1 · W2</text><rect x="430" y="177" width="260" height="14" rx="3" fill="#e4e9f2" stroke="#dde1e8" stroke-width="1"/><rect class="w-fast wf-1" x="430" y="177" width="260" height="14" rx="3" fill="#57cc5a"/><text x="702" y="188" fill="#5f6676" font-size="10.5" class="t-mono">128–256M</text><text x="322" y="215" fill="#111318" font-size="11.5" font-weight="700" class="t-mono">S2 · W3</text><rect x="430" y="204" width="260" height="14" rx="3" fill="#e4e9f2" stroke="#dde1e8" stroke-width="1"/><rect class="w-fast wf-2" x="430" y="204" width="260" height="14" rx="3" fill="#57cc5a"/><text x="702" y="215" fill="#5f6676" font-size="10.5" class="t-mono">256–384M</text><text x="322" y="242" fill="#111318" font-size="11.5" font-weight="700" class="t-mono">S3 · W4</text><rect x="430" y="231" width="260" height="14" rx="3" fill="#e4e9f2" stroke="#dde1e8" stroke-width="1"/><rect class="w-fast wf-3" x="430" y="231" width="260" height="14" rx="3" fill="#57cc5a"/><text x="702" y="242" fill="#5f6676" font-size="10.5" class="t-mono">384–512M</text><text x="322" y="269" fill="#111318" font-size="11.5" font-weight="700" class="t-mono">S4 · W5</text><rect x="430" y="258" width="260" height="14" rx="3" fill="#e4e9f2" stroke="#dde1e8" stroke-width="1"/><rect class="w-fast wf-4" x="430" y="258" width="260" height="14" rx="3" fill="#57cc5a"/><text x="702" y="269" fill="#5f6676" font-size="10.5" class="t-mono">512–640M</text><text x="322" y="296" fill="#111318" font-size="11.5" font-weight="700" class="t-mono">S5 · W6→W2</text><rect x="430" y="285" width="260" height="14" rx="3" fill="#e4e9f2" stroke="#dde1e8" stroke-width="1"/><rect class="w-slow" x="430" y="285" width="92" height="14" rx="3" fill="#c97a16"/><rect class="w-split" x="522" y="285" width="168" height="14" rx="3" fill="#57cc5a"/><line x1="522" y1="282" x2="522" y2="302" stroke="#111318" stroke-width="1.5" stroke-dasharray="2 2"/><text x="702" y="296" fill="#c97a16" font-size="10.5" font-weight="700" class="t-mono">DROP + RE-SPLIT</text><text x="322" y="323" fill="#111318" font-size="11.5" font-weight="700" class="t-mono">S6 · W7</text><rect x="430" y="312" width="260" height="14" rx="3" fill="#e4e9f2" stroke="#dde1e8" stroke-width="1"/><rect class="w-fast wf-6" x="430" y="312" width="260" height="14" rx="3" fill="#57cc5a"/><text x="702" y="323" fill="#5f6676" font-size="10.5" class="t-mono">768–896M</text><text x="322" y="350" fill="#111318" font-size="11.5" font-weight="700" class="t-mono">S7 · W8</text><rect x="430" y="339" width="260" height="14" rx="3" fill="#e4e9f2" stroke="#dde1e8" stroke-width="1"/><rect class="w-fast wf-7" x="430" y="339" width="260" height="14" rx="3" fill="#57cc5a"/><text x="702" y="350" fill="#5f6676" font-size="10.5" class="t-mono">896M–1G</text>

  <!-- Connector 2->3 -->
  <path class="pulse-arrow" d="M810 232h22m-7-6l7 6-7 6" fill="none" stroke="#0d58c9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stage 3: Sparse Write + Atomic Rename -->
  <rect x="838" y="94" width="234" height="278" rx="8" fill="#f0f3f7" stroke="#dde1e8" stroke-width="1.2"/>
  <text x="854" y="120" fill="#5f6676" font-size="11" font-weight="700" letter-spacing="0.9" class="t-disp">STAGE 03  ·  ATOMIC COMMIT</text>
  <line x1="854" y1="130" x2="1056" y2="130" stroke="#111318" stroke-width="1.5"/>
  <text x="854" y="156" fill="#111318" font-size="12.5" font-weight="700" class="t-mono">sparse .bmd.part</text>
  <text x="854" y="178" fill="#434956" font-size="12" class="t-body">Direct offset pwrite, no</text>
  <text x="854" y="196" fill="#434956" font-size="12" class="t-body">post-download file merge.</text>
  <text x="854" y="224" fill="#111318" font-size="12.5" font-weight="700" class="t-mono">craft-atomic .bmd.json</text>
  <text x="854" y="244" fill="#434956" font-size="12" class="t-body">Crash-safe resume table.</text>
  <text x="854" y="272" fill="#111318" font-size="12.5" font-weight="700" class="t-mono">SHA-256 + rename()</text>
  <text x="854" y="292" fill="#434956" font-size="12" class="t-body">Size &amp; hash verified.</text>

  <g class="commit-stamp">
      <g transform="rotate(-5.0 954.0 333.0)">
    <rect x="876" y="314" width="156" height="38" rx="6" fill="#fcfcfb" fill-opacity="0.94" stroke="#1b7a26" stroke-width="2.5"/>
    <rect x="873" y="311" width="162" height="44" rx="8" fill="none" stroke="#1b7a26" stroke-width="1.4" stroke-opacity="0.85"/>
    <text x="954.0" y="338" text-anchor="middle" fill="#1b7a26" font-family="'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="800" letter-spacing="1.1">DELIVERED</text>
  </g>
  </g>
</svg>
