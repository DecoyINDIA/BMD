    <rect x="44" y="30" width="1032" height="244" rx="12" fill="#000000" fill-opacity="0.22"/>
    <rect x="44" y="28" width="1032" height="244" rx="12" fill="#11151d"/>
    <g clip-path="url(#close-dark-clip)">
      <rect x="44" y="28" width="1032" height="44" fill="#eef1f6"/>
      <text x="68" y="55" fill="#11151d" font-size="14" font-weight="800" letter-spacing="0.9" class="t-disp">SIGN OFF  ·  CARRIER: DECOYINDIA/BMD</text>
      <text x="1052" y="55" text-anchor="end" fill="#192030" font-size="12" class="t-mono">GPL-3.0 · RUST · 86 LANGUAGES · ZERO ADS</text>
    </g>

      <g transform="translate(62 92) scale(0.2200)">
    <g>
