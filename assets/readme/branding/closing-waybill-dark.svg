<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" width="1120" height="300" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Black Marlin Closing Waybill (dark)</title>
  <desc id="svg-desc">Tilted closing thermal waybill featuring the Marlin crest, license/language/crate fields, Code 128 barcode, and Signed For stamp.</desc>
  <defs>
    <linearGradient id="close-dark-bg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#081226"/>
      <stop offset="100%" stop-color="#081226"/>
    </linearGradient>
    <linearGradient id="close-dark-dorsal" x1="161" y1="110" x2="185" y2="269" gradientUnits="userSpaceOnUse">
      <stop stop-color="#80dbad"/>
      <stop offset=".29" stop-color="#55c99d"/>
      <stop offset=".67" stop-color="#187052"/>
      <stop offset="1" stop-color="#369d77"/>
    </linearGradient>
    <linearGradient id="close-dark-tail" x1="81" y1="358" x2="204" y2="438" gradientUnits="userSpaceOnUse">
      <stop stop-color="#66d2a5"/>
      <stop offset=".63" stop-color="#359a75"/>
      <stop offset="1" stop-color="#187052"/>
    </linearGradient><clipPath id="close-dark-clip"><rect x="44" y="28" width="1032" height="244" rx="12"/></clipPath>
  </defs>
  <style>
    .t-disp { font-family: 'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .t-body { font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .t-mono { font-family: 'IBM Plex Mono', 'Cascadia Mono', Consolas, ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .tnum { font-variant-numeric: tabular-nums; }

    .sign-stamp {
      transform-box: fill-box;
      transform-origin: center;
      animation: sign-pulse 6s ease-in-out infinite;
    }
    @keyframes sign-pulse {
      0%, 100% { transform: rotate(-6deg) scale(1); }
      50% { transform: rotate(-6deg) scale(1.03); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sign-stamp { animation: none; transform: rotate(-6deg); }
    }
  </style>
  <rect width="1120" height="300" rx="16" fill="url(#close-dark-bg)"/>
