    </g>
    
  </g>

    <text x="186" y="122" fill="#eef1f6" font-size="30" font-weight="800" letter-spacing="-0.6" class="t-disp">Black Marlin Downloader</text>
    <text x="186" y="148" fill="#c3cad6" font-size="14" class="t-body">Rebuilt from scratch in Rust. Free for everyone, forever — no trials, no telemetry, no ads.</text>

    <!-- Ruled Sign-off Fields -->
    <line x1="186" y1="168" x2="736" y2="168" stroke="#eef1f6" stroke-width="1.5"/>
    <line x1="366" y1="168" x2="366" y2="238" stroke="#eef1f6" stroke-width="1.5"/>
    <line x1="556" y1="168" x2="556" y2="238" stroke="#eef1f6" stroke-width="1.5"/>
    <line x1="186" y1="238" x2="736" y2="238" stroke="#eef1f6" stroke-width="1.5"/>

    <text x="192" y="188" fill="#98a1b1" font-size="10.5" font-weight="700" letter-spacing="0.7" class="t-disp">LICENSE</text>
    <text x="192" y="218" fill="#eef1f6" font-size="16" font-weight="700" class="t-mono">GNU GPL-3.0</text>

    <text x="378" y="188" fill="#98a1b1" font-size="10.5" font-weight="700" letter-spacing="0.7" class="t-disp">LOCALIZATION</text>
    <text x="378" y="218" fill="#eef1f6" font-size="16" font-weight="700" class="t-body">86 langs (incl. RTL)</text>

    <text x="568" y="188" fill="#98a1b1" font-size="10.5" font-weight="700" letter-spacing="0.7" class="t-disp">WORKSPACE</text>
    <text x="568" y="218" fill="#eef1f6" font-size="16" font-weight="700" class="t-mono">15 crates + ext</text>

    <!-- Barcode + Stamp -->
    <line x1="758" y1="92" x2="758" y2="246" stroke="#98a1b1" stroke-width="1.4" stroke-dasharray="5 5"/>
    <g class="sign-stamp">
        <g transform="rotate(-6.0 891.0 113.0)">
    <rect x="786" y="94" width="210" height="38" rx="6" fill="#11151d" fill-opacity="0.94" stroke="#6bdb6e" stroke-width="2.5"/>
    <rect x="783" y="91" width="216" height="44" rx="8" fill="none" stroke="#6bdb6e" stroke-width="1.4" stroke-opacity="0.85"/>
