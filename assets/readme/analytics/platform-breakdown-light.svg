<style>
    .t-disp { font-family: 'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; }
    .t-lbl { font-family: 'IBM Plex Mono', 'Cascadia Mono', Consolas, ui-monospace, monospace; font-weight: 600; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; fill: #5A756A; }
    .t-val { font-family: 'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; fill: #091511; }
