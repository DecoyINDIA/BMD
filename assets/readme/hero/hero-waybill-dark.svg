<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Black Marlin Downloader v1.0.0 Hero Waybill (dark)</title>
  <desc id="svg-desc">Blue board hero featuring the Black Marlin silhouette, 8-lane live segment telemetry, and tilted thermal waybill with Code 128 barcode.</desc>
  <defs>
    <linearGradient id="hero-dark-bg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#0c1a33"/>
      <stop offset="100%" stop-color="#081226"/>
    </linearGradient>
    <linearGradient id="hero-dark-dorsal" x1="161" y1="110" x2="185" y2="269" gradientUnits="userSpaceOnUse">
      <stop stop-color="#80dbad"/>
      <stop offset=".29" stop-color="#55c99d"/>
      <stop offset=".67" stop-color="#187052"/>
      <stop offset="1" stop-color="#369d77"/>
    </linearGradient>
    <linearGradient id="hero-dark-tail" x1="81" y1="358" x2="204" y2="438" gradientUnits="userSpaceOnUse">
      <stop stop-color="#66d2a5"/>
      <stop offset=".63" stop-color="#359a75"/>
      <stop offset="1" stop-color="#187052"/>
    </linearGradient>
    <clipPath id="hero-dark-wb-clip"><rect x="676" y="42" width="474" height="434" rx="12"/></clipPath>
  </defs>
  <style>
    .t-disp { font-family: 'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .t-body { font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .t-mono { font-family: 'IBM Plex Mono', 'Cascadia Mono', Consolas, ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .tnum { font-variant-numeric: tabular-nums; }

    .marlin-draw {
      stroke-dasharray: 1850;
      stroke-dashoffset: 0;
      animation: draw-marlin 1.8s ease-out 1;
    }
    .marlin-fill {
      animation: fill-marlin 1.8s ease-out 1;
    }
    .stamp-pop {
      transform-box: fill-box;
      transform-origin: center;
      animation: stamp-land 7.5s cubic-bezier(.2,.9,.3,1) infinite;
    }
    .scan-beam {
      animation: scan-glide 7.5s ease-in-out infinite;
    }
    @keyframes draw-marlin {
      0% { stroke-dashoffset: 1850; opacity: 1; }
      65% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes fill-marlin {
      0%, 45% { opacity: 0.12; }
      85%, 100% { opacity: 1; }
    }
    @keyframes stamp-land {
      0%, 48% { opacity: 0; transform: scale(1.28) rotate(-7deg); }
      54%, 92% { opacity: 1; transform: scale(1) rotate(-7deg); }
      98%, 100% { opacity: 0; transform: scale(1) rotate(-7deg); }
    }
    @keyframes scan-glide {
      0%, 44% { transform: translateX(0px); opacity: 0; }
      48% { opacity: 0.85; }
      66% { transform: translateX(200px); opacity: 0.85; }
      70%, 100% { transform: translateX(200px); opacity: 0; }
    }
    @keyframes seg0 { 0%, 8% { transform: scaleX(0.02); } 51%, 92% { transform: scaleX(1); } 100% { transform: scaleX(0.02); } }
    .seg-0 { transform-box: fill-box; transform-origin: left center; animation: seg0 7.5s cubic-bezier(.22,.8,.36,1) infinite; }
@keyframes seg1 { 0%, 13% { transform: scaleX(0.02); } 52%, 92% { transform: scaleX(1); } 100% { transform: scaleX(0.02); } }
    .seg-1 { transform-box: fill-box; transform-origin: left center; animation: seg1 7.5s cubic-bezier(.22,.8,.36,1) infinite; }
@keyframes seg2 { 0%, 10% { transform: scaleX(0.02); } 58%, 92% { transform: scaleX(1); } 100% { transform: scaleX(0.02); } }
    .seg-2 { transform-box: fill-box; transform-origin: left center; animation: seg2 7.5s cubic-bezier(.22,.8,.36,1) infinite; }
@keyframes seg3 { 0%, 15% { transform: scaleX(0.02); } 57%, 92% { transform: scaleX(1); } 100% { transform: scaleX(0.02); } }
    .seg-3 { transform-box: fill-box; transform-origin: left center; animation: seg3 7.5s cubic-bezier(.22,.8,.36,1) infinite; }
@keyframes seg4 { 0%, 12% { transform: scaleX(0.02); } 49%, 92% { transform: scaleX(1); } 100% { transform: scaleX(0.02); } }
    .seg-4 { transform-box: fill-box; transform-origin: left center; animation: seg4 7.5s cubic-bezier(.22,.8,.36,1) infinite; }
@keyframes seg5 { 0%, 16% { transform: scaleX(0.02); } 62%, 92% { transform: scaleX(1); } 100% { transform: scaleX(0.02); } }
    .seg-5 { transform-box: fill-box; transform-origin: left center; animation: seg5 7.5s cubic-bezier(.22,.8,.36,1) infinite; }
@keyframes seg6 { 0%, 14% { transform: scaleX(0.02); } 54%, 92% { transform: scaleX(1); } 100% { transform: scaleX(0.02); } }
    .seg-6 { transform-box: fill-box; transform-origin: left center; animation: seg6 7.5s cubic-bezier(.22,.8,.36,1) infinite; }
@keyframes seg7 { 0%, 18% { transform: scaleX(0.02); } 63%, 92% { transform: scaleX(1); } 100% { transform: scaleX(0.02); } }
    .seg-7 { transform-box: fill-box; transform-origin: left center; animation: seg7 7.5s cubic-bezier(.22,.8,.36,1) infinite; }
    @media (prefers-reduced-motion: reduce) {
      .marlin-draw { animation: none; opacity: 0; }
      .marlin-fill, .stamp-pop, .seg-fill { animation: none !important; opacity: 1 !important; transform: none !important; }
      .stamp-pop { transform: rotate(-7deg) !important; }
      .scan-beam { animation: none; opacity: 0; }
    }
  </style>
