ke="#5f6676" stroke-width="1.6"/><rect x="660" y="414" width="144" height="74" rx="7" fill="#f0f3f7" stroke="#dde1e8" stroke-width="1.2"/><text x="670" y="434" fill="#5f6676" font-size="9.5" class="t-mono">crates/geo</text><text x="670" y="455" fill="#111318" font-size="13.5" font-weight="800" class="t-disp">bmd-geo</text><text x="670" y="474" fill="#434956" font-size="11" class="t-body">DB-IP + flags</text><line class="bus-flow" x1="885.0" y1="386" x2="885.0" y2="414" stroke="#5f6676" stroke-width="1.6"/><rect x="813" y="414" width="144" height="74" rx="7" fill="#f0f3f7" stroke="#dde1e8" stroke-width="1.2"/><text x="823" y="434" fill="#5f6676" font-size="9.5" class="t-mono">crates/crash</text><text x="823" y="455" fill="#111318" font-size="13.5" font-weight="800" class="t-disp">bmd-crash</text><text x="823" y="474" fill="#434956" font-size="11" class="t-body">Minidumps</text><line class="bus-flow" x1="1038.0" y1="386" x2="1038.0" y2="414" stroke="#5f6676" stroke-width="1.6"/><rect x="966" y="414" width="144" height="74" rx="7" fill="#f0f3f7" stroke="#dde1e8" stroke-width="1.2"/><text x="976" y="434" fill="#5f6676" font-size="9.5" class="t-mono">crates/labserver</text><text x="976" y="455" fill="#111318" font-size="13.5" font-weight="800" class="t-disp">bmd-labserver</text><text x="976" y="474" fill="#434956" font-size="11" class="t-body">Fault server</text>

  <text x="48" y="514" fill="#5f6676" font-size="11" class="t-mono">Total: 15 Cargo workspace crates (app, cli, cnl, crash, debrid, engine, extract, geo, ipc, labserver, mcp, nmhost, remote, tools, torrent) + extension/</text>
