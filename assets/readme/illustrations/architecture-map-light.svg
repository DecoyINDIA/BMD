<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="1160" height="560" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">BMD Architecture Blueprint (light)</title>
  <desc id="svg-desc">Architectural map of BMD&#x27;s 15 Rust workspace crates and browser extension connected via bmd-ipc and bmd-engine.</desc>
  <defs>
    <linearGradient id="arch-light-bg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#1f63d6"/>
      <stop offset="100%" stop-color="#1854bb"/>
    </linearGradient><clipPath id="arch-light-clip"><rect x="24" y="24" width="1112" height="512" rx="12"/></clipPath>
  </defs>
  <style>
    .t-disp { font-family: 'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .t-body { font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .t-mono { font-family: 'IBM Plex Mono', 'Cascadia Mono', Consolas, ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .tnum { font-variant-numeric: tabular-nums; }

    .bus-flow { stroke-dasharray: 7 7; animation: flow 2.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @media (prefers-reduced-motion: reduce) { .bus-flow { animation: none; } }
  </style>
  <rect width="1160" height="560" rx="16" fill="url(#arch-light-bg)"/>
  <path d="M40 0v560M80 0v560M120 0v560M160 0v560M200 0v560M240 0v560M280 0v560M320 0v560M360 0v560M400 0v560M440 0v560M480 0v560M520 0v560M560 0v560M600 0v560M640 0v560M680 0v560M720 0v560M760 0v560M800 0v560M840 0v560M880 0v560M920 0v560M960 0v560M1000 0v560M1040 0v560M1080 0v560M1120 0v560M0 40h1160M0 80h1160M0 120h1160M0 160h1160M0 200h1160M0 240h1160M0 280h1160M0 320h1160M0 360h1160M0 400h1160M0 440h1160M0 480h1160M0 520h1160" stroke="#3b78e0" stroke-width="1" stroke-opacity="0.22"/>
  <path d="M16 24h12M22 18v12M1132 24h12M1138 18v12M16 536h12M22 530v12M1132 536h12M1138 530v12" stroke="#e6eefd" stroke-width="1.2" stroke-opacity="0.35" stroke-linecap="round"/>
  <rect x="1" y="1" width="1158" height="558" rx="15" fill="none" stroke="#3b78e0" stroke-width="1.5"/>
    <g>
    <rect x="24" y="32" width="1112" height="512" rx="12" fill="#06163c" fill-opacity="0.24"/>
    <rect x="24" y="25" width="1112" height="512" rx="12" fill="#06163c" fill-opacity="0.16"/>
    <rect x="24" y="24" width="1112" height="512" rx="12" fill="#fcfcfb"/>
  </g>
  <g clip-path="url(#arch-light-clip)">
    <rect x="24" y="24" width="1112" height="46" fill="#111318"/>
    <text x="48" y="53" fill="#fcfcfb" font-size="15.5" font-weight="800" letter-spacing="0.7" class="t-disp">BMD WORKSPACE ARCHITECTURE  ·  15 RUST CRATES + EXTENSION</text>
    <text x="1112" y="52" text-anchor="end" fill="#f0f3f7" font-size="12" class="t-mono">Dependencies point inward · Engine knows nothing of UI</text>
  </g>

  <text x="48" y="92" fill="#5f6676" font-size="10.5" font-weight="700" letter-spacing="0.9" class="t-disp">ENTRY SURFACES &amp; CLIENTS</text>
  <rect x="48" y="104" width="166" height="74" rx="7" fill="#f0f3f7" stroke="#111318" stroke-width="1.3"/><text x="60" y="123" fill="#5f6676" font-size="10" class="t-mono">extension/</text><text x="60" y="146" fill="#111318" font-size="14" font-weight="800" class="t-disp">Browser Ext</text><text x="60" y="165" fill="#434956" font-size="11.5" class="t-body">MV3 &amp; Firefox</text><line class="bus-flow" x1="131.0" y1="178" x2="131.0" y2="210" stroke="#0d58c9" stroke-width="2"/><rect x="226" y="104" width="166" height="74" rx="7" fill="#f0f3f7" stroke="#111318" stroke-width="1.3"/><text x="238" y="123" fill="#5f6676" font-size="10" class="t-mono">crates/nmhost</text><text x="238" y="146" fill="#111318" font-size="14" font-weight="800" class="t-disp">bmd-nmhost</text><text x="238" y="165" fill="#434956" font-size="11.5" class="t-body">Native Host</text><line class="bus-flow" x1="309.0" y1="178" x2="309.0" y2="210" stroke="#0d58c9" stroke-width="2"/><rect x="404" y="104" width="166" height="74" rx="7" fill="#f0f3f7" stroke="#111318" stroke-width="1.3"/><text x="416" y="123" fill="#5f6676" font-size="10" class="t-mono">crates/app</text><text x="416" y="146" fill="#111318" font-size="14" font-weight="800" class="t-disp">bmd-app</text><text x="416" y="165" fill="#434956" font-size="11.5" class="t-body">egui Desktop</text><line class="bus-flow" x1="487.0" y1="178" x2="487.0" y2="210" stroke="#0d58c9" stroke-width="2"/><rect x="582" y="104" width="166" height="74" rx="7" fill="#f0f3f7" stroke="#111318" stroke-width="1.3"/><text x="594" y="123" fill="#5f6676" font-size="10" class="t-mono">crates/cli</text><text x="594" y="146" fill="#111318" font-size="14" font-weight="800" class="t-disp">bmd-cli</text><text x="594" y="165" fill="#434956" font-size="11.5" class="t-body">Headless CLI</text><line class="bus-flow" x1="665.0" y1="178" x2="665.0" y2="210" stroke="#0d58c9" stroke-width="2"/><rect x="760" y="104" width="166" height="74" rx="7" fill="#f0f3f7" stroke="#111318" stroke-width="1.3"/><text x="772" y="123" fill="#5f6676" font-size="10" class="t-mono">crates/mcp</text><text x="772" y="146" fill="#111318" font-size="14" font-weight="800" class="t-disp">bmd-mcp</text><text x="772" y="165" fill="#434956" font-size="11.5" class="t-body">AI stdio MCP</text><line class="bus-flow" x1="843.0" y1="178" x2="843.0" y2="210" stroke="#0d58c9" stroke-width="2"/><rect x="938" y="104" width="166" height="74" rx="7" fill="#f0f3f7" stroke="#111318" stroke-width="1.3"/><text x="950" y="123" fill="#5f6676" font-size="10" class="t-mono">crates/remote</text><text x="950" y="146" fill="#111318" font-size="14" font-weight="800" class="t-disp">bmd-remote</text><text x="950" y="165" fill="#434956" font-size="11.5" class="t-body">HTTPS Remote</text><line class="bus-flow" x1="1021.0" y1="178" x2="1021.0" y2="210" stroke="#0d58c9" stroke-width="2"/>

  <!-- Tier 2: IPC & CNL -->
  <rect x="48" y="210" width="844" height="62" rx="8" fill="#1f63d6" fill-opacity="0.10" stroke="#0d58c9" stroke-width="1.6"/>
  <text x="66" y="234" fill="#0d58c9" font-size="13.5" font-weight="800" class="t-disp">crates/ipc  ·  bmd-ipc (Single-Instance Automation Bus)</text>
  <text x="66" y="255" fill="#434956" font-size="12" class="t-body">Token-authenticated local socket · Shared capture rules · LinksPart chunking · Data directory</text>

  <rect x="910" y="210" width="202" height="62" rx="8" fill="#f0f3f7" stroke="#111318" stroke-width="1.3"/>
  <text x="926" y="234" fill="#111318" font-size="13.5" font-weight="800" class="t-disp">crates/cnl · bmd-cnl</text>
  <text x="926" y="255" fill="#434956" font-size="11.5" class="t-body">Click&apos;n&apos;Load 2 (:9666)</text>
  <line class="bus-flow" x1="892" y1="241" x2="910" y2="241" stroke="#0d58c9" stroke-width="2"/>

  <!-- Bus to Engine -->
  <line class="bus-flow" x1="580" y1="272" x2="580" y2="302" stroke="#0d58c9" stroke-width="2.4"/>

  <!-- Tier 3: Engine Core -->
  <rect x="48" y="302" width="1064" height="84" rx="8" fill="#fcfcfb" stroke="#111318" stroke-width="2"/>
  <rect x="48" y="302" width="10" height="84" rx="3" fill="#0d58c9"/>
  <text x="72" y="328" fill="#111318" font-size="16" font-weight="800" class="t-disp">crates/engine  ·  bmd-engine (Core Segmented Transfer Engine)</text>
  <text x="1096" y="328" text-anchor="end" fill="#1b7a26" font-size="11.5" font-weight="700" class="t-mono">HTTP/1.1 · HTTPS · FTP/FTPS</text>
  <text x="72" y="352" fill="#434956" font-size="12.5" class="t-mono">probe() → Planner (largest-part re-split) → Worker × N → HostLimits → Token Limiter</text>
  <text x="72" y="372" fill="#5f6676" font-size="12" class="t-mono">Sparse .bmd.part + craft-atomic .bmd.json · BoringSSL browser-like TLS · sites/ resolvers</text>

  <!-- Tier 4: Specialist Crates -->
  <text x="48" y="406" fill="#5f6676" font-size="10.5" font-weight="700" letter-spacing="0.9" class="t-disp">SPECIALIST PROTOCOLS, TOOLS &amp; VERIFICATION CRATES</text>
