# Emerald: one of BMD's built-in themes, and an example of a theme file.
# White transfer surfaces, a sage sidebar and a forest-green primary action. The night variant
# uses the same hierarchy with pine surfaces and a mint accent.
#
# A theme file names only what it changes. A few seeds per variant derive every other colour
# (`crate::derive`), so a role BMD adds later arrives in this look rather than the classic one.
# The icons are Metro's: one-colour line art where the default look has pictures.

name = "Emerald"
icons = "mono"
icon-set = "metro"

[controls]
field-focus = "ring"
check = "fluent"
button = "fluent"
progress = "bar"
scroll = "overlay"
focus = "ring"

[sizes]
radius = 6
"radius.button" = 6
"radius.part" = 4
"radius.check" = 4
"radius.flyout" = 10
"radius.menu-item" = 6
"radius.egui" = 6
"radius.popup" = 8
border = 1
"focus-line" = 2
"list.row" = 32
"list.header" = 32

[seeds.light]
background = "#f8fbf9"
surface = "#ffffff"
header = "#f1f6f3"
text = "#152e24"
accent = "#187052"
selection = "#d8efe2"
error = "#d1004f"
warning = "#8a6100"
success = "#0e7a55"

[seeds.dark]
background = "#14211d"
surface = "#182822"
header = "#1b3028"
text = "#eef7f2"
accent = "#80dbad"
selection = "#2b523f"
error = "#ff8095"
warning = "#ffdb13"
success = "#3ecf8e"

[light]
"selection.text" = "#152e24"
"selection.inactive" = "#e9f3ed"
"selection.focus" = "#187052"
"focus.ring" = "#185a44"
"progress.track" = "#c7ded1"
"tree-chevrons" = true
"tree" = "#edf5ef"
"header.sep" = "#dce9e1"
"header.line" = "#dce9e1"
"list.grid" = "#e7efe9"
"chip.web" = "#e1f2e8"
"chip.torrent" = "#e7ede9"
"chip.text" = "#254536"

[dark]
"selection.text" = "#eef7f2"
"selection.inactive" = "#233b30"
"selection.focus" = "#80dbad"
"focus.ring" = "#a5f0c5"
"progress.track" = "#466456"
"tree" = "#1b3028"
"header.sep" = "#304b3e"
"header.line" = "#304b3e"
"list.grid" = "#284236"
"chip.web" = "#284c3a"
"chip.torrent" = "#2e433a"
"chip.text" = "#e1f2e8"
