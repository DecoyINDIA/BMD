[package]
name = "bmd-android-bridge"
description = "Native Android JNI and admitted-network adapter for BMD"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "bmd_android_bridge"
# An rlib for the workspace (tests, clippy) on every host; tools/android/build_native.py asks for
# the Android shared library itself (`cargo rustc --crate-type cdylib`). A cdylib on every host
# would be linked on desktop builds too, where MinGW's linker refuses a DLL this size
# ("export ordinal too large") and stops `cargo test --workspace` on x86_64-pc-windows-gnu.

[dependencies]
bmd-engine.workspace = true
futures.workspace = true
getrandom = "0.4.3"
hex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
libc = "0.2.186"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
rustls-platform-verifier.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
