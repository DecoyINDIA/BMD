[package]
name = "bmd-tools"
description = "Verified, pinned installs of helper tools (yt-dlp) for BMD"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
aws-lc-rs.workspace = true
base64.workspace = true
bytes.workspace = true
craft-atomic.workspace = true
futures.workspace = true
hex.workspace = true
bmd-engine.workspace = true
bmd-ipc.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
percent-encoding.workspace = true
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
bmd-labserver.workspace = true
tempfile.workspace = true

[features]
# Update now's end-to-end tests only, never in a release (tools/installer and release.yml don't
# turn it on): the app's `/show update-now` and BMD_TEST_UPDATE_HOLD (see bmd-app).
test-update = []

# A fake yt-dlp and the checks against it in one program (#68; see the file).
[[test]]
name = "fake_ytdlp"
harness = false

# System helpers use a PATH of their own in a child process, without changing the test runner's.
[[test]]
name = "system_helpers"
harness = false

[lints]
workspace = true

[target."cfg(windows)".dependencies]
win32job = "2.0.3"

# A helper's process group killed whole (#1301), safely.
[target."cfg(unix)".dependencies]
rustix = { version = "1.1.6", features = ["process"] }
