# Problems with the website and help pages. Each page's "Report a problem with this page" opens it
# with the page filled in (tools/website/build.py: the id `page` is the URL's parameter).
name: Website problem
description: A mistake, broken link or confusing instructions on the Black Marlin Downloader website or help pages.
labels: [website]
body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: https://xolver.in/products/bmd/#downloads
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: For something that looks broken.
      placeholder: Safari on an iPhone 15, Chrome 131 on Windows 11
