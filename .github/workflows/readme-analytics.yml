# Refreshes DecoyINDIA/BMD's live GitHub release & repository telemetry (data/analytics/downloads.json),
# regenerates the Pelagic Orbital analytics SVGs (and Living Adoption WebPs when Velocity deps exist),
# and updates README.md's plain-text telemetry table every 6 hours.
name: README Analytics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-analytics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Anti-loop guard: only run on scheduled or manual dispatches.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Collect live GitHub release & repository telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/readme/collect_stats.py

      - name: Generate Pelagic Orbital analytics SVGs & telemetry table
        run: python scripts/readme/generate_analytics.py --with-webp-if-available

      - name: Run analytics unit tests
        run: python -m unittest scripts/readme/test_analytics.py

      - name: Validate analytics SVG & WebP assets and budgets
        run: python scripts/readme/validate_assets.py --analytics-only

      - name: Check for telemetry changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- data/analytics/downloads.json assets/readme/analytics/ README.md)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No telemetry changes to commit."
          fi

      - name: Upload updated telemetry files
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readme-analytics-update
          path: |
            data/analytics/downloads.json
            assets/readme/analytics/
            README.md
          retention-days: 1

  publish:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: readme-analytics-update
          path: .

      - name: Commit and push updated telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- data/analytics/downloads.json assets/readme/analytics/ README.md)" ]; then
            echo "No telemetry changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analytics/downloads.json assets/readme/analytics/
          if [ -n "$(git status --porcelain -- README.md)" ]; then
            git add README.md
          fi
          git commit -m "chore(analytics): refresh README telemetry [skip ci]"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push
