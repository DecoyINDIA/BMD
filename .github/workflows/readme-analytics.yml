# Refreshes DecoyINDIA/BMD's live GitHub release & repository telemetry (data/analytics/downloads.json)
# and regenerates the Waybill-styled analytics SVGs (assets/readme/analytics/*.svg) every 6 hours.
name: README Analytics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-analytics
  cancel-in-progress: false

jobs:
  update-analytics:
    runs-on: ubuntu-latest
    # Anti-loop guard: only run on scheduled or manual dispatches.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Collect live GitHub release & repository telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/readme/collect_stats.py

      - name: Generate Waybill analytics SVGs
        run: python scripts/readme/generate_analytics.py

      - name: Run analytics unit tests
        run: python -m unittest scripts/readme/test_analytics.py

      - name: Validate SVG assets and budgets
        run: python scripts/readme/validate_assets.py --analytics-only

      - name: Commit updated telemetry if changed
        run: |
          if [ -z "$(git status --porcelain -- data/analytics/downloads.json assets/readme/analytics/ README.md)" ]; then
            echo "No telemetry changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analytics/downloads.json assets/readme/analytics/
          if [ -n "$(git status --porcelain -- README.md)" ]; then
            git add README.md
          fi
          git commit -m "chore(analytics): refresh README telemetry [skip ci]"
          git push
